services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: neuroread
      POSTGRES_PASSWORD: neuroread_secret
      POSTGRES_DB: neuroread
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuroread"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://neuroread:neuroread_secret@db:5432/neuroread
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
